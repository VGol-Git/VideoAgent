[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipscout"
version = "0.1.0"
description = "Budgeted video search and inspection with traceable evidence"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
video = ["opencv-python-headless>=4.10,<5", "Pillow>=10", "numpy>=1.26,<3"]
local = ["torch==2.6.0", "torchvision==0.21.0", "transformers>=4.57,<5", "Pillow>=10", "opencv-python-headless>=4.10,<5"]
asr = ["faster-whisper>=1.1,<2"]
analysis = ["matplotlib==3.10.8", "numpy>=1.26,<3"]
research = ["rapidocr==3.9.2", "onnxruntime>=1.20,<2", "omegaconf==2.3.0", "transformers>=4.57,<5", "numpy>=1.26,<3", "Pillow>=10"]

[project.scripts]
clipscout = "clipscout.cli:main"

[tool.setuptools.packages.find]
include = ["clipscout*"]

[tool.setuptools.package-data]
clipscout = ["static/*.html"]
